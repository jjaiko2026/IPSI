<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>전국 대학교 체육·스포츠 학과 목록</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div>
          <p class="eyebrow">2026년 현재 기준</p>
          <h1>전국 대학교 체육·스포츠 학과 목록</h1>
        </div>
        <div class="header-actions">
          <button id="nextSchoolBtn" class="secondary-btn">+ 다음 학교</button>
          <button id="downloadCsv" class="primary-btn">CSV 다운로드</button>
        </div>
      </header>

      <section class="criteria-box">
        <h2>적용 기준</h2>
        <ul>
          <li>사범대학 제외</li>
          <li>체육교육과 제외</li>
          <li>대학원 제외</li>
          <li>학과명 기준으로 정리</li>
          <li>학부/전공/트랙은 별도 확인 필요</li>
        </ul>
      </section>

      <section class="stats">
        <div class="stat-card">
          <span class="label">대학 수</span>
          <strong id="universityCount">0</strong>
        </div>
        <div class="stat-card">
          <span class="label">학과명 수</span>
          <strong id="departCount">0</strong>
        </div>
        <div class="stat-card">
          <span class="label">표시 행 수</span>
          <strong id="visibleCount">0</strong>
        </div>
      </section>

      <section class="toolbar">
        <label class="input-wrap">
          <span>검색</span>
          <input id="searchInput" type="text" placeholder="대학명, 단과대학명, 학과명 검색" />
        </label>

        <label class="input-wrap">
          <span>지역</span>
          <select id="regionFilter">
            <option value="all">전체</option>
            <option value="서울">서울</option>
            <option value="부산">부산</option>
            <option value="광주">광주</option>
            <option value="대구">대구</option>
            <option value="경남">경남</option>
          </select>
        </label>
      </section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>대학명</th>
              <th>지역</th>
              <th>단과대학명</th>
              <th>학과명</th>
              <th>전형유형</th>
              <th>실기</th>
              <th>면접</th>
              <th>교과성적만</th>
              <th>실기 항목</th>
              <th>확인 상태</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
